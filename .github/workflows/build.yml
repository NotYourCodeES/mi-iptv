name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: with these secrets both apps are signed with the same key on every build, so
      # new versions install over old ones. Without them, the debug key is used.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIIPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MIIPTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: using the debug key"
          fi

      - name: Run unit tests and build the APKs
        env:
          MIIPTV_KEYSTORE_PASSWORD: ${{ secrets.MIIPTV_KEYSTORE_PASSWORD }}
          MIIPTV_KEY_ALIAS: ${{ secrets.MIIPTV_KEY_ALIAS }}
          MIIPTV_KEY_PASSWORD: ${{ secrets.MIIPTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest :app:assembleRelease :phone:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MiIPTV.apk
          cp phone/build/outputs/apk/release/phone-release.apk dist/MiIPTV-Remote.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apks
          path: dist/*.apk

      - name: Attach APKs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TV="MiIPTV-${GITHUB_REF_NAME}.apk"
          PHONE="MiIPTV-Remote-${GITHUB_REF_NAME}.apk"
          cp dist/MiIPTV.apk "$TV"
          cp dist/MiIPTV-Remote.apk "$PHONE"
          # Release notes come from docs/releases/<tag>.md when it exists, otherwise from the commits
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          # Works whether the release was created on github.com or not yet
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TV" "$PHONE" --clobber
            if [ -f "$NOTES" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"; fi
          elif [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "$TV" "$PHONE" --title "Mi IPTV $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$TV" "$PHONE" --title "Mi IPTV $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
